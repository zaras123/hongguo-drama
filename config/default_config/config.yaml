# 红果短剧解析插件默认配置
# 首次运行会自动复制到 config/config/config.yaml，改那份即可

# 插件内托管服务，通过 #红果安装、#红果设备、#红果启动 操作
pythonPath: "python"
adbPath: "adb"
adbDevice: ""
managedPort: 18780
managedSignPort: 18781
# 留空时由插件启动本机签名服务；有现成签名服务可填 HTTP(S) 地址
externalSignServer: ""
fridaHost: "127.0.0.1:27042"
fridaBin: "/data/local/tmp/frida-server"

# 自动识别消息里的红果分享链接/短链
enableAutoParse: true

# 群里发链接时自动下载。false = 只回复剧集信息
autoDownload: true

# 自动下载选集：shared = 始终优先下载分享链接指向的那一集，first = 第1集
# 也可以直接写 1、1-3、全部，仍受 maxEpisodesPerRequest 限制
autoDownloadRange: "shared"

# 解析红果漫剧分享链接（kylin.hainanyuyue.com / hainanyuyue.com/share/...）
manjuEnable: true

# 漫剧在官网按剧名找回剧集页时，最多试几条搜索结果
manjuSearchLimit: 5

# 单条命令最多下载几集
maxEpisodesPerRequest: 3
maxConcurrentDownloads: 2
maxConcurrentParses: 4

# 单个视频最大体积（MB），0 表示不限制
maxFileSizeMB: 100

# 发送方式：video = 直接发视频，file = 上传群文件
sendType: video

# 发送完成后删除本地缓存文件
cleanupAfterSend: true

# file 使用原始绝对路径；远程协议端不能访问文件时用 base64
videoTransport: file
maxBase64SizeMB: 30
# 每次下载都需要 ffprobe 验证 MP4 视频轨道；转码另需含 libx264 的 ffmpeg
transcodeVideo: false
ffmpegPath: "ffmpeg"
ffprobePath: "ffprobe"
transcodeTimeout: 600000

# 搜索命令最多展示几条结果
searchLimit: 8

# 解析结果缓存时长（秒），用于 "#红果下载 1-3" 直接复用
sessionTTL: 1800

# 页面请求超时（毫秒）
requestTimeout: 30000
maxPageSizeMB: 4
downloadTimeout: 600000

# 下载停滞判定（毫秒）与失败重试次数
downloadIdleTimeout: 60000
downloadRetries: 2

# 直链失效或断流时，整集重新下载的次数
episodeRetries: 2

# 视频临时目录，相对路径以 Yunzai 运行目录为基准
tempDir: "./temp"

# 站点与 UA
siteOrigin: "https://hongguoduanju.com"
userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

# ===== 可选：自建红果 API 服务（zhangbaio/hongguo 的 server.py）=====
# 配好后优先从自建服务取「已解密的可播 MP4」，失败会自动回退上面的官网解析。
# 留空表示不使用自建服务。
apiServer: ""
# 服务端 /admin 生成的 api_key（上游强制鉴权，必须填；不是 ADMIN_TOKEN）
apiKey: ""
# 配套 run_bridge.py 的 HONGGUO_SESSION_TOKEN；仅用于主人私聊登录管理
# 至少 16 字符，必须和普通 apiKey、ADMIN_TOKEN 分开设置
sessionToken: ""
# 是否启用自建服务（false = 只走官网解析）
useApiServer: true
# 配了 apiServer 时是否优先使用它
preferApiServer: true
# 清晰度：best / 1080p / 720p / 540p / 480p / 360p
# 注意服务端 720p 及以下是 bytevc2 编码，部分播放器解不了，默认 best 取 1080p(HEVC)
streamQuality: "best"
# 自建服务首次要现签名+下载+解密，可能较慢，因此超时给得更宽松
apiServerTimeout: 180000
apiServerIdleTimeout: 300000
